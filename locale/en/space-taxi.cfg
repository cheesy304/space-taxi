[mod-setting-description]
space-taxi-default-passengers=Used for ships whose Passengers box in the hub window has never been changed.
space-taxi-hold-seconds=When the ship arrives, it is paused until you are aboard (or have landed). If no rocket is ready within this time, the ship leaves and you wait for its next visit.

